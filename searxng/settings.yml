# SearXNG configuration for a Render free Web Service.
# Merged on top of the defaults shipped in the pinned image.
# Docs: https://docs.searxng.org/admin/settings/
use_default_settings: true

general:
  instance_name: "SearXNG"
  # No in-memory usage/statistics counters.
  enable_metrics: false

search:
  # English UI and English engine results by default.
  default_lang: "en"
  # Blank disables autocomplete (keystrokes are not sent to a third party).
  autocomplete: ""
  # Only expose the HTML UI and the JSON API. Drop csv/rss.
  formats:
    - html
    - json
  # Retry a failed engine after an hour instead of the 24h default, so a
  # temporary block does not remove it for a whole day.
  suspended_times:
    SearxEngineAccessDenied: 3600
    SearxEngineCaptcha: 3600
    SearxEngineTooManyRequests: 3600

server:
  # No valkey service on the free plan, so the limiter cannot run.
  # Trade-off: no per-IP rate limiting. See README "Limitations".
  limiter: false
  public_instance: false
  # Proxying images hides the visitor's IP from image hosts.
  # Costs some bandwidth/memory; disable if the instance is heavily used.
  image_proxy: true
  # Secret comes from $SEARXNG_SECRET (generated by Render); never put it here.

outgoing:
  # Global engine timeout, overridable per engine below.
  request_timeout: 4.0
  max_request_timeout: 8.0

ui:
  default_locale: "en"

engines:
  # Google and Bing are disabled in current SearXNG defaults because
  # datacenter IPs are frequently blocked. Re-enabled here on request.
  - name: google
    disabled: false
    timeout: 5.0
  - name: bing
    disabled: false
    timeout: 5.0
  # Brave and DuckDuckGo are already enabled upstream; only tighten timeouts.
  - name: brave
    timeout: 5.0
  - name: duckduckgo
    timeout: 5.0
